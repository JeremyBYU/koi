[workspace]
members = ["crates/*"]
# Plain cargo build, test and clippy at the root cover every crate.
default-members = [".", "crates/*"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
authors = ["Jeremy Castagno"]

[workspace.dependencies]
koi-audio = { path = "crates/koi-audio" }
koi-render = { path = "crates/koi-render" }
koi-sim = { path = "crates/koi-sim" }
koi-term = { path = "crates/koi-term" }
koi-theme = { path = "crates/koi-theme" }
base64 = "0.22"
bytemuck = { version = "1.25", features = ["derive"] }
libc = "0.2"
miniz_oxide = "0.9"
pollster = "1.0"
rodio = { version = "0.22.2", default-features = false, features = ["playback", "mp3", "vorbis"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "ogg", "vorbis"] }
toml = "0.9"
wgpu = { version = "30.0.1", default-features = false, features = ["vulkan", "wgsl", "std"] }
windows-sys = "0.61"

[package]
name = "koi-pond"
description = "A tranquil koi pond for the terminal"
readme = "README.md"
repository = "https://github.com/JeremyBYU/koi"
keywords = ["koi", "terminal", "kitty-graphics", "ambient", "game"]
categories = ["games", "command-line-utilities"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "koi"
path = "src/main.rs"

[dependencies]
koi-audio.workspace = true
koi-render.workspace = true
koi-sim.workspace = true
koi-term.workspace = true
koi-theme.workspace = true
serde.workspace = true
toml.workspace = true

[dev-dependencies]
# Decodes the sixel encoder's output in the tests.
icy_sixel = "0.7"

# The release archives: scripts/release.sh.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true
