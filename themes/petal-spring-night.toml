name = "Petal Spring at Night"
description = "The same pond at night in blue moonlight, with fireflies over the water."
extends = "petal-spring"
family = "petal-spring"
time = "night"

[palette]
deep = "#153D6B"
mid = "#2F647A"
shallow = "#6B8D9D"
highlight = "#E8C9EA"
shadow = "#422E6F"
stone_light = "#B8A3B7"
stone_dark = "#534371"
lily_dark = "#405555"
lily_light = "#7E8980"
lily_flower = "#E5AED6"
koi_white = "#EEEAE5"
koi_red = "#D45C41"
koi_sumi = "#201A28"
ogon = "#E7BB65"
outline = "#C4D4EC"   # rim mode: the moonlit edge on the side facing the moon

[light]
sun = [-0.4, -0.9]
warm = 0.1
cool = 0.3
ambient = 0.9

[style]
caustics = 0.12
glint = 0.7
glint_threshold = 0.8
cloud_reflections = 0.0
leaf_shadows = 0.3
outline = "rim"

[scene]
weather = "fireflies"
weather_amount = 0.6
