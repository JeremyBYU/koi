name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # The archives are named from Cargo.toml, so a tag that names another version would publish
  # mislabelled files.
  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          test "$GITHUB_REF_NAME" = "v$version" || { echo "The tag is $GITHUB_REF_NAME but Cargo.toml says $version."; exit 1; }

  linux:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.0
      - run: cargo install cargo-zigbuild --locked
      - run: scripts/release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.tar.gz

  macos:
    needs: version
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: scripts/release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.tar.gz

  windows:
    needs: version
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      # The runner's git would check out CRLF line endings, which bash cannot run.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - run: bash scripts/release.sh
        env:
          PYTHON: python
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip

  # The same checks as CI, on the tagged commit. Nothing is published unless they pass.
  ci:
    needs: version
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [ci, linux, macos, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum -- *.tar.gz *.zip > SHA256SUMS
      # Named, not dist/*: the CI run above also leaves its macOS screenshot among the artifacts.
      - run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.zip dist/SHA256SUMS --title "koi $GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
